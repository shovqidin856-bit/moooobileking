<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Zaproslar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">❮</a>
        <h1>⚡ ADMIN PANEL</h1>
    </header>

    <div class="container">
        <div class="page-title">KELIB TUSHDAN ZAPROSLAR (SOTISH UCHUN)</div>

        <div id="requests-list"></div>
    </div>

    <script>
        function loadRequests() {
            fetch('/api/admin/requests')
                .then(res => {
                    if(res.status === 403) {
                        alert("Siz admin emassiz!");
                        window.location.href = 'index.html';
                        return [];
                    }
                    return res.json();
                })
                .then(data => {
                    const list = document.getElementById('requests-list');
                    if(!data || data.length === 0) {
                        list.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:30px;">Yangi zaproslar yo\'q.</p>';
                        return;
                    }

                    list.innerHTML = data.map(req => `
                        <div class="phone-card">
                            <img src="${req.image}" alt="${req.title}">
                            <div class="phone-info">
                                <div class="phone-title">${req.title}</div>
                                <div class="phone-price">${req.price}</div>
                                <div class="phone-meta">👤 <b>Yuboruvchi (User):</b> ${req.username}</div>
                                <div class="phone-meta">📱 <b>Brend/Model:</b> ${req.brand} (${req.model})</div>
                                <div class="phone-meta">✨ <b>Holat:</b> ${req.condition}</div>
                                <div class="phone-meta">📞 <b>Tel:</b> ${req.phone_number}</div>
                                <div class="phone-meta">📝 <b>Tavsif:</b> ${req.description}</div>
                                
                                <div class="action-row">
                                    <button onclick="approveRequest(${req.id})" class="approve-btn">✅ TASDIQLASH (SAYTGA CHIQARISH)</button>
                                    <button onclick="rejectRequest(${req.id})" class="reject-btn">❌ BEKOR QILISH</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                });
        }

        function approveRequest(id) {
            fetch('/api/admin/approve-request/' + id, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert("E'lon saytga muvaffaqiyatli chiqarildi!");
                        loadRequests();
                    }
                });
        }

        function rejectRequest(id) {
            fetch('/api/admin/reject-request/' + id, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert("Zapros rad etildi!");
                        loadRequests();
                    }
                });
        }

        loadRequests();
    </script>
</body>
</html>
