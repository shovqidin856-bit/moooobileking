<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILE KING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1><a href="index.html">MOBILE KING</a></h1>
        <div id="auth-box" class="auth-status"></div>
    </header>

    <div class="container">
        <div class="menu-list">
            <a href="buy.html" class="menu-btn">
                <span>TELEFON SOTIB OLISH</span>
                <span>➔</span>
            </a>

            <a href="sell.html" class="menu-btn">
                <span>TELEFON SOTISH (ZAPROS)</span>
                <span>➔</span>
            </a>

            <a href="order.html" class="menu-btn">
                <span>BUYURTMA ASOSIDA TAYYORLASH</span>
                <span>➔</span>
            </a>

            <a href="info.html" class="menu-btn">
                <span>QO'SHIMCHA MA'LUMOTLAR</span>
                <span>➔</span>
            </a>

            <a href="about.html" class="menu-btn">
                <span>ILOVA HAQIDA</span>
                <span>➔</span>
            </a>

            <a href="admin.html" id="admin-link" class="menu-btn" style="display:none; border-color:#eab308; color:#fde047;">
                <span>⚡ ADMIN PANEL (ZAPROSLAR)</span>
                <span>➔</span>
            </a>
        </div>

        <div class="bottom-grid">
            <a href="faq.html" class="bottom-btn">QO'SH SAVOLLAR UCHUN</a>
            <a href="media.html" class="bottom-btn">MEDIA MANZILLARIMIZ</a>
        </div>
    </div>

    <script>
        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                const box = document.getElementById('auth-box');
                if(data.loggedIn) {
                    box.innerHTML = `<span>👤 ${data.user.username}</span> <button class="auth-btn" onclick="logout()">Chiqish</button>`;
                    if(data.user.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'flex';
                    }
                } else {
                    box.innerHTML = `<a href="login.html" class="auth-btn">Kirish / Kirish</a>`;
                }
            });

        function logout() {
            fetch('/api/logout', { method: 'POST' }).then(() => location.reload());
        }
    </script>
</body>
</html>
