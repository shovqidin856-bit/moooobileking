<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Modellar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="buy.html" class="back-btn">❮</a>
        <h1>MOBILE KING</h1>
    </header>

    <div class="container">
        <div class="page-title">IPHONE MODELLARI (5 DAN 18 PRO MAX GACHA)</div>

        <div id="iphone-grid" class="model-grid"></div>
    </div>

    <script>
        const models = [
            "iPhone 5", "iPhone 5s", "iPhone 6", "iPhone 6 Plus", "iPhone 6s", "iPhone 6s Plus",
            "iPhone SE (1st gen)", "iPhone 7", "iPhone 7 Plus", "iPhone 8", "iPhone 8 Plus", "iPhone X",
            "iPhone XR", "iPhone XS", "iPhone XS Max", "iPhone 11", "iPhone 11 Pro", "iPhone 11 Pro Max",
            "iPhone SE (2nd gen)", "iPhone 12 mini", "iPhone 12", "iPhone 12 Pro", "iPhone 12 Pro Max",
            "iPhone 13 mini", "iPhone 13", "iPhone 13 Pro", "iPhone 13 Pro Max", "iPhone SE (3rd gen)",
            "iPhone 14", "iPhone 14 Plus", "iPhone 14 Pro", "iPhone 14 Pro Max", "iPhone 15",
            "iPhone 15 Plus", "iPhone 15 Pro", "iPhone 15 Pro Max", "iPhone 16", "iPhone 16 Plus",
            "iPhone 16 Pro", "iPhone 16 Pro Max", "iPhone 17", "iPhone 17 Pro Max", "iPhone 18", "iPhone 18 Pro Max"
        ];

        const container = document.getElementById('iphone-grid');
        container.innerHTML = models.map(m => `
            <a href="catalog.html?brand=iPhone&model=${encodeURIComponent(m)}" class="model-btn"> ${m}</a>
        `).join('');
    </script>
</body>
</html>
