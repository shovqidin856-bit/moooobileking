<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="buy.html" class="back-btn">❮</a>
        <h1 id="brand-title">KATALOG</h1>
    </header>

    <div class="container">
        <div id="phone-container" class="phone-grid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const brand = urlParams.get('brand');
        const model = urlParams.get('model');

        let titleText = brand ? brand.toUpperCase() : "KATALOG";
        if (model) titleText = model.toUpperCase();
        document.getElementById('brand-title').innerText = titleText;

        let query = '/api/phones?';
        if (brand) query += 'brand=' + encodeURIComponent(brand) + '&';
        if (model) query += 'model=' + encodeURIComponent(model);

        fetch(query)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('phone-container');
                if(!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:30px;">Hozircha e\'lonlar topilmadi.</p>';
                    return;
                }
                container.innerHTML = data.map(phone => `
                    <div class="phone-card">
                        <img src="${phone.image}" alt="${phone.title}">
                        <div class="phone-info">
                            <div class="phone-title">${phone.title}</div>
                            <div class="phone-price">${phone.price}</div>
                            <div class="phone-meta"><b>Model:</b> ${phone.model || phone.brand}</div>
                            <div class="phone-meta"><b>Holati:</b> ${phone.condition}</div>
                            <div class="phone-meta">${phone.description}</div>
                            <a href="tel:${phone.phone_number}" class="call-btn">📞 Qo'ng'iroq qilish (${phone.phone_number})</a>
                        </div>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
