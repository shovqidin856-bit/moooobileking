<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefon Sotish (Zapros)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">❮</a>
        <h1>MOBILE KING</h1>
    </header>

    <div class="container">
        <div class="page-title">TELEFON SOTISH (ADMINGA ZAPROS YUBORISH)</div>

        <div class="form-card">
            <p style="color: #eab308; font-size: 13px; margin-bottom: 15px;">⚠️ Siz to'ldirgan ma'lumotlar avval adminga zapros bo'lib boradi. Admin tasdiqlagach saytga chiqadi.</p>

            <form action="/api/sell-request" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>E'lon sarlavhasi</label>
                    <input type="text" name="title" class="form-control" placeholder="masalan: iPhone 13 Pro Max 256GB" required>
                </div>

                <div class="form-group">
                    <label>Brendni tanlang</label>
                    <select name="brand" class="form-control" required>
                        <option value="iPhone">iPhone</option>
                        <option value="Redmi">Redmi</option>
                        <option value="Samsung">Samsung</option>
                        <option value="Honor">Honor</option>
                        <option value="Tecno">Tecno</option>
                        <option value="Poco">Poco</option>
                        <option value="Oppo">Oppo</option>
                        <option value="Boshqa">Boshqa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Aniq model (masalan: iPhone 13 Pro Max yoki A54)</label>
                    <input type="text" name="model" class="form-control" placeholder="Model nomi" required>
                </div>

                <div class="form-group">
                    <label>Sotish narxi</label>
                    <input type="text" name="price" class="form-control" placeholder="masalan: $650" required>
                </div>

                <div class="form-group">
                    <label>Holati</label>
                    <input type="text" name="condition" class="form-control" placeholder="masalan: A'lo, Karobka bor" required>
                </div>

                <div class="form-group">
                    <label>Telefon raqamingiz</label>
                    <input type="tel" name="phone_number" class="form-control" placeholder="+998901234567" required>
                </div>

                <div class="form-group">
                    <label>Batafsil ma'lumot</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Rang, batareya %..."></textarea>
                </div>

                <div class="form-group">
                    <label>Telefon rasmi</label>
                    <input type="file" name="image" class="form-control" accept="image/*" required>
                </div>

                <button type="submit" class="submit-btn">ADMINGA ZAPROS YUBORISH</button>
            </form>
        </div>
    </div>

    <script>
        fetch('/api/me').then(r => r.json()).then(d => {
            if(!d.loggedIn) {
                alert("Telefon sotish uchun avval tizimga kiring!");
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
